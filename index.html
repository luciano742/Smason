        :root {
            --primary-color: #232f3e;
            --secondary-color: #febd69;
            --background-color: #eaeded;
            --text-color: #0F1111;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--secondary-color);
        }

        .controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        select, button {
            padding: 0.5rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        .cart-btn {
            background-color: var(--secondary-color);
            font-weight: bold;
        }

        .register-btn {
            background-color: #ffd814;
            font-weight: bold;
        }

        .upload-toggle-btn {
            background-color: #007185;
            color: white;
            font-weight: bold;
        }

        .categories-bar {
            background-color: #37475a;
            padding: 0.75rem 2rem;
            display: flex;
            gap: 1.5rem;
            overflow-x: auto;
            white-space: nowrap;
        }

        .category-item {
            color: var(--white);
            background: none;
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 2px;
        }

        .category-item:hover, .category-item.active {
            background-color: rgba(255,255,255,0.2);
            color: var(--secondary-color);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .auth-section, .upload-section {
            background-color: var(--white);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: none;
        }

        .auth-section h2, .upload-section h2 {
            margin-bottom: 1rem;
            font-size: 1.3rem;
            color: var(--primary-color);
        }

        .auth-form, .upload-form {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .auth-form input, .upload-form input, .upload-form select {
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
            min-width: 200px;
        }

        .upload-form input[type="file"] {
            border: none;
            padding: 0.2rem;
        }

        .auth-form button, .upload-form button {
            background-color: var(--primary-color);
            color: var(--white);
            font-weight: bold;
            padding: 0.5rem 1rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background-color: var(--white);
            border-radius: 8px;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .product-card::after {
            content: "📷 Clicca per caricare foto";
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .product-card:hover::after {
            opacity: 1;
        }

        .delete-prod-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #cc0000;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

            height: 150px;

            border-radius: 4px;
            margin-bottom: 0.75rem;
            background-color: #f0f0f0;

            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }

        .product-card p {
            color: #565959;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;

            align-items: center;
            gap: 0.3rem;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
            color: #007185;

            color: #ffa41c;
            cursor: pointer;
            letter-spacing: 1px;
            unicode-bidi: bidi-override;
            direction: rtl;
            text-align: left;
        }

        .stars > span {
            display: inline-block;
            position: relative;
            unicode-bidi: bidi-override;
            direction: ltr;
        }
        .stars > span:hover:before,

            color: #ffa41c;
        }

        .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #B12704;
            margin-bottom: 1rem;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

            border-radius: 20px;
            padding: 0.5rem 1rem;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }

        .add-to-cart:hover {
            background-color: #f7ca00;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--white);
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);

            margin-bottom: 1rem;
            color: var(--primary-color);

            overflow-y: auto;
            margin-bottom: 1rem;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;

            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;

            align-items: center;
            gap: 0.4rem;

        .cart-item-controls button {
            background-color: #ddd;

            border-radius: 3px;

        .shipping-calculator {

            gap: 1.5rem;

        function getLangKey(selectValue) {
            let base = selectValue.split('-')[0];
            return translations[selectValue] ? selectValue : (translations[base] ? base : 'it');
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            products.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.setAttribute('data-category', prod.category);
                card.setAttribute('onclick', 'triggerCardImageUpload(this, event)');
                card.setAttribute('data-id', prod.id);

                let deleteBtnHTML = prod.isCustom ? `<button class="delete-prod-btn" onclick="event.stopPropagation(); deleteProduct(${prod.id})" title="Elimina prodotto">×</button>` : '';

                const selectVal = document.getElementById('lang-select').value;
                const t = translations[getLangKey(selectVal)] || translations['it'];

                card.innerHTML = `
                    ${deleteBtnHTML}
                    <div>
                        <img src="${prod.img || ''}" alt="${prod.name}" class="product-img">
                        <h3 class="prod-title">${prod.name}</h3>
                        <p class="prod-desc">${prod.desc}</p>
                        <div class="rating-box" onclick="event.stopPropagation()">
                            <div class="stars" onclick="event.stopPropagation()">
                                <span onclick="rateProduct(this, ${prod.id}, 5)">★</span><span onclick="rateProduct(this, ${prod.id}, 4)">★</span><span onclick="rateProduct(this, ${prod.id}, 3)">★</span><span onclick="rateProduct(this, ${prod.id}, 2)">★</span><span onclick="rateProduct(this, ${prod.id}, 1)">★</span>
                            </div>
                            <span class="rating-text"><strong class="avg-rating">${prod.avgRating.toFixed(1)}</strong> (<span class="review-count">${prod.reviewCount}</span>)</span>
                        </div>
                    </div>
                    <div>
                        <div class="price" data-price="${prod.price}">${formatPrice(prod.price)}</div>
                        <div class="card-actions">
                            <button class="add-to-cart btn-text" onclick="event.stopPropagation(); addToCart(${prod.id})">${t.add}</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            const activeCatBtn = document.querySelector('.category-item.active');
            if (activeCatBtn) {
                let activeId = activeCatBtn.id;
                let catKey = 'all';
                if (activeId === 'cat-elec') catKey = 'elettronica';
                if (activeId === 'cat-cloth') catKey = 'abbigliamento';
                if (activeId === 'cat-home') catKey = 'casa';
                if (activeId === 'cat-jewels') catKey = 'gioielli';
                if (activeId === 'cat-sport') catKey = 'sport';
                filterCategory(catKey, activeCatBtn);
            }
        }

        function changeLanguage() {
            const selectVal = document.getElementById('lang-select').value;
            const t = translations[getLangKey(selectVal)] || translations['it'];

            document.getElementById('cart-btn-text').innerHTML = `${t.cart} (<span id="cart-count">${cart.reduce((sum, item) => sum + item.quantity, 0)}</span>)`;
            document.getElementById('reg-btn-text').innerText = t.register;
            document.getElementById('upload-toggle-text').innerText = t.upload;
            document.getElementById('footer-copy').innerHTML = t.copy;
            document.getElementById('wa-link').innerText = t.whatsapp;
            document.getElementById('contact-link').innerText = t.contact;
            document.getElementById('tiktok-link').innerText = t.tiktok;
            document.getElementById('modal-title').innerText = t.modalTitle;
            document.getElementById('wa-order-btn').innerText = t.waBtn;
            document.getElementById('close-modal-btn').innerText = t.closeBtn;
            document.getElementById('auth-title').innerText = t.authTitle;
            document.getElementById('auth-submit').innerText = t.authSubmit;
            document.getElementById('upload-title').innerText = t.uploadTitle;
            document.getElementById('upload-submit-btn').innerText = t.uploadBtn;
            document.getElementById('dest-label').innerText = t.destLabel;

            const destSelect = document.getElementById('shipping-dest');
            if (destSelect) {
                destSelect.options[0].text = t.optItaly;
                destSelect.options[1].text = t.optEur;
                destSelect.options[2].text = t.optUsa;
                destSelect.options[3].text = t.optWorld;
            }

            document.getElementById('cat-all').innerText = t.catAll;
            document.getElementById('cat-elec').innerText = t.catElec;
            document.getElementById('cat-cloth').innerText = t.catCloth;
            document.getElementById('cat-home').innerText = t.catHome;
            document.getElementById('cat-jewels').innerText = t.catJewels;
            document.getElementById('cat-sport').innerText = t.catSport;

            const catSelect = document.getElementById('new-prod-cat');
            if(catSelect) {
                catSelect.options[0].text = t.catElec;
                catSelect.options[1].text = t.catCloth;
                catSelect.options[2].text = t.catHome;
                catSelect.options[3].text = t.catJewels;
                catSelect.options[4].text = t.catSport;
            }

            document.querySelectorAll('.btn-text').forEach(btn => {
                btn.innerText = t.add;
            });

            if (document.getElementById('cartModal').style.display === 'flex') {
                openCart();
            }
        }

        function filterCategory(category, btnElement) {
            document.querySelectorAll('.category-item').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            const cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function toggleAuth() {
            const section = document.getElementById('auth-section');
            const uploadSec = document.getElementById('upload-section');
            uploadSec.style.display = 'none';
            section.style.display = section.style.display === 'block' ? 'none' : 'block';
        }

        function toggleUpload() {
            const section = document.getElementById('upload-section');
            const authSec = document.getElementById('auth-section');
            authSec.style.display = 'none';
            section.style.display = section.style.display === 'block' ? 'none' : 'block';
        }

        function registerUser() {
            const name = document.getElementById('username').value;
            const selectVal = document.getElementById('lang-select').value;
            const t = translations[getLangKey(selectVal)] || translations['it'];
            if(name) {
                alert(`${t.regSuccess} Benvenuto, ${name}!`);
                document.getElementById('auth-section').style.display = 'none';
            } else {
                alert("Inserisci un nome valido.");
            }
        }

        function triggerCardImageUpload(cardElement, event) {
            activeCardForImage = cardElement;
            document.getElementById('quick-file-input').click();
        }

        function handleQuickImageUpload(event) {
            const fileInput = event.target;
            if (fileInput.files && fileInput.files[0] && activeCardForImage) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const prodId = parseInt(activeCardForImage.getAttribute('data-id'));
                    const prod = products.find(p => p.id === prodId);
                    if (prod) {
                        prod.img = e.target.result;
                        localStorage.setItem('smazon_products', JSON.stringify(products));
                    }
                    const imgEl = activeCardForImage.querySelector('.product-img');
                    if (imgEl) {
                        imgEl.src = e.target.result;
                    }
                    activeCardForImage = null;
                    fileInput.value = '';
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        function rateProduct(starElement, prodId, ratingValue) {
            const prod = products.find(p => p.id === prodId);
            if (prod) {
                let newTotalScore = (prod.avgRating * prod.reviewCount) + ratingValue;
                prod.reviewCount += 1;
                prod.avgRating = newTotalScore / prod.reviewCount;
                localStorage.setItem('smazon_products', JSON.stringify(products));
                renderProducts();
                alert(`Grazie per la tua recensione di ${ratingValue} stelle! Valutazione aggiornata.`);
            }
        }

        function addNewProduct() {
            const name = document.getElementById('new-prod-name').value;
            const desc = document.getElementById('new-prod-desc').value;
            const price = parseFloat(document.getElementById('new-prod-price').value);
            const category = document.getElementById('new-prod-cat').value;
            const imageInput = document.getElementById('new-prod-img');

            if (!name || isNaN(price)) {
                alert("Inserisci almeno un nome valido e un prezzo numerico.");
                return;
            }

            const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;

            const saveAndRender = (imgData) => {
                const newProd = {
                    id: newId,
                    name: name,
                    desc: desc || 'Nessuna descrizione inserita.',
                    price: price,
                    category: category,
                    img: imgData || '',
                    avgRating: 5.0,
                    reviewCount: 1,
                    isCustom: true
                };

                products.unshift(newProd);
                localStorage.setItem('smazon_products', JSON.stringify(products));
                renderProducts();

                document.getElementById('upload-section').style.display = 'none';
                document.getElementById('new-prod-name').value = '';
                document.getElementById('new-prod-desc').value = '';
                document.getElementById('new-prod-price').value = '';
                document.getElementById('new-prod-img').value = '';
                alert("Prodotto caricato con successo!");
            };

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveAndRender(e.target.result);
                };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                saveAndRender('');
            }
        }

        function deleteProduct(prodId) {
            if (confirm("Vuoi davvero eliminare questo prodotto?")) {
                products = products.filter(p => p.id !== prodId);
                localStorage.setItem('smazon_products', JSON.stringify(products));
                renderProducts();
            }
        }

        function addToCart(prodId) {
            const prod = products.find(p => p.id === prodId);
            if (!prod) return;

            const existing = cart.find(item => item.id === prodId);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ id: prod.id, name: prod.name, price: prod.price, quantity: 1 });
            }

            localStorage.setItem('smazon_cart', JSON.stringify(cart));
            updateCartCount();
            
            const selectVal = document.getElementById('lang-select').value;
            const t = translations[getLangKey(selectVal)] || translations['it'];
            alert(`${prod.name} ${t.add.toLowerCase()}!`);
        }

        function updateCartQuantity(prodId, change) {
            const item = cart.find(i => i.id === prodId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== prodId);
                }
            }
            localStorage.setItem('smazon_cart', JSON.stringify(cart));
            updateCartCount();
            openCart();
        }

        function updateCartCount() {
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').innerText = totalCount;
        }

        function formatPrice(basePrice) {
            const currency = document.getElementById('currency-select').value;
            let symbol = '€';
            let convertedPrice = basePrice;

            if (currency === 'USD') {
                convertedPrice = basePrice * 1.1;
                symbol = '$';
            } else if (currency === 'GBP') {
                convertedPrice = basePrice * 0.85;
                symbol = '£';
            } else if (currency === 'RUB') {
                convertedPrice = basePrice * 101.5;
                symbol = '₽';
            } else if (currency === 'CNY') {
                convertedPrice = basePrice * 7.9;
                symbol = '¥';
            } else if (currency === 'IDR') {
                convertedPrice = basePrice * 16900;
                symbol = 'Rp ';
            } else if (currency === 'PKR') {
                convertedPrice = basePrice * 305;
                symbol = 'Rs ';
            }

            if (currency === 'IDR' || currency === 'PKR') {
                return symbol + convertedPrice.toLocaleString('it-IT', {maximumFractionDigits: 0});
            } else {
                return symbol + convertedPrice.toFixed(2);
            }
        }

        function getShippingCost() {
            const dest = document.getElementById('shipping-dest').value;
            if (dest === 'europe') return 10.00;
            if (dest === 'usa') return 20.00;
            if (dest === 'world') return 35.00;
            return 0.00;
        }

        function openCart() {
            const selectVal = document.getElementById('lang-select').value;
            const t = translations[getLangKey(selectVal)] || translations['it'];
            const listContainer = document.getElementById('cart-items-list');
            const totalsContainer = document.getElementById('cart-totals-container');
            
            listContainer.innerHTML = '';
            if (cart.length === 0) {
                listContainer.innerHTML = `<p>${t.emptyCart}</p>`;
                totalsContainer.innerHTML = '';
            } else {
                let html = '';
                let subtotal = 0;
                cart.forEach((item) => {
                    html += `
                        <div class="cart-item-row">
                            <span>${item.name} (${formatPrice(item.price)})</span>
                            <div class="cart-item-controls">
                                <button onclick="updateCartQuantity(${item.id}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button onclick="updateCartQuantity(${item.id}, 1)">+</button>
                            </div>
                        </div>
                    `;
                    subtotal += item.price * item.quantity;
                });
                listContainer.innerHTML = html;

                let shippingCost = getShippingCost();
                let grandTotal = subtotal + shippingCost;

                totalsContainer.innerHTML = `
                    <div class="cart-summary"><span>${t.subtotal || 'Subtotale'}:</span> <span>${formatPrice(subtotal)}</span></div>
                    <div class="cart-summary"><span>${t.shipping}:</span> <span>${formatPrice(shippingCost)}</span></div>
                    <div class="cart-summary" style="font-weight: bold; margin-top: 5px;"><span>${t.total}:</span> <span>${formatPrice(grandTotal)}</span></div>
                `;
            }
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeCart() {
            document.getElementById('cartModal').style.display = 'none';
        }

        function sendOrderWhatsApp() {
            if (cart.length === 0) {
                alert("Il carrello è vuoto.");
                return;
            }
            const selectVal = document.getElementById('lang-select').value;
            const t = translations[getLangKey(selectVal)] || translations['it'];
            const destText = document.getElementById('shipping-dest').selectedOptions[0].text;

            let message = "Salve, vorrei ordinare i seguenti prodotti da Smazon (TikTok Shop):\n";
            let subtotal = 0;
            cart.forEach(item => {
                message += `- ${item.name} x${item.quantity} (${formatPrice(item.price * item.quantity)})\n`;
                subtotal += item.price * item.quantity;
            });
            let shippingCost = getShippingCost();
            let grandTotal = subtotal + shippingCost;

            message += `\nDestinazione: ${destText}`;
            message += `\n${t.shipping}: ${formatPrice(shippingCost)}`;
            message += `\n${t.total}: ${formatPrice(grandTotal)}`;
            
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/393494605029?text=${encodedMessage}`, '_blank');
        }

        function changeCurrency() {
            const priceElements = document.querySelectorAll('.price');
            priceElements.forEach(el => {
                let basePrice = parseFloat(el.getAttribute('data-price'));
                el.innerText = formatPrice(basePrice);
            });

            if (document.getElementById('cartModal').style.display === 'flex') {
                openCart();
            }
        }

        // Inizializzazione al caricamento della pagina
        window.onload = function() {
            renderProducts();
            updateCartCount();
        };
    </script>
