<!DOCTYPE html>
<html lang="it" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smason Store - Enterprise Edition</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
            cursor: pointer;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .btn-outline:hover {
            background-color: var(--border-color);
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .folders-grid-container, .products-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .folder-card, .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .folder-card h3, .product-card h3 {
            font-size: 1.1rem;
        }

        .product-price {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1.15rem;
        }

        /* Modals & Accessibility Focus Trap Support */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 0.5rem;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 90vh;
            overflow-y: auto;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            margin-bottom: 0.75rem;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            font-size: 1rem;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            font-size: 0.875rem;
            color: #64748b;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <a class="logo" id="home-link">Smason Store</a>
        <div class="header-actions">
            <button class="btn btn-outline" id="open-cart-btn" aria-expanded="false">Carrello (<span id="cart-count">0</span>)</button>
            <button class="btn" id="open-admin-btn">Admin / Gestione</button>
        </div>
    </header>

    <main>
        <!-- Vista Categorie (Home) -->
        <section id="view-folders" aria-label="Catalog Folders">
            <div class="section-header">
                <h2>Categorie Prodotti</h2>
            </div>
            <div id="folders-grid" class="folders-grid-container">
                <!-- Generato dinamicamente via JS -->
            </div>
        </section>

        <!-- Vista Prodotti di una Categoria -->
        <section id="view-products" class="hidden" aria-label="Category Products">
            <div class="section-header">
                <h2 id="category-title">Prodotti</h2>
                <button class="btn btn-outline" id="back-to-folders">← Torna alle Categorie</button>
            </div>
            <div id="products-grid" class="products-grid-container">
                <!-- Generato dinamicamente via JS -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Smason Store - Enterprise Edition. Tutti i diritti riservati.</p>
    </footer>

    <!-- Modale Carrello -->
    <div class="modal-overlay" id="cart-modal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal" tabindex="-1">
            <h2>Il tuo Carrello</h2>
            <div id="cart-items-container">Il carrello è vuoto.</div>
            <div id="cart-total-container" style="font-weight: bold; font-size: 1.1rem; margin-top: 0.5rem; text-align: right;"></div>
            <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
                <button class="btn btn-outline" id="close-cart-btn">Chiudi</button>
                <button class="btn" id="checkout-btn">Procedi all'ordine</button>
            </div>
        </div>
    </div>

    <!-- Modale Admin / Gestione -->
    <div class="modal-overlay" id="admin-modal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal" tabindex="-1">
            <h2>Pannello di Gestione (Admin)</h2>
            <hr style="border: 0; border-top: 1px solid var(--border-color);">
            <h3>Aggiungi Nuovo Prodotto</h3>
            <form id="add-product-form">
                <div class="form-group">
                    <label for="new-prod-name">Nome Prodotto</label>
                    <input type="text" id="new-prod-name" required placeholder="Es. Articolo Esempio">
                </div>
                <div class="form-group">
                    <label for="new-prod-category">Categoria</label>
                    <select id="new-prod-category">
                        <option value="1">Categoria 1</option>
                        <option value="2">Categoria 2</option>
                        <option value="3">Categoria 3</option>
                        <option value="4">Categoria 4</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="new-prod-price">Prezzo (€)</label>
                    <input type="number" step="0.01" id="new-prod-price" required placeholder="14.50">
                </div>
                <button type="submit" class="btn">Salva Prodotto</button>
            </form>
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin-top: 1rem;">
            <h3>Prodotti Esistenti</h3>
            <div id="admin-products-list" style="max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem;">
                <!-- Lista admin -->
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
                <button class="btn btn-outline" id="close-admin-btn">Chiudi Pannello</button>
            </div>
        </div>
    </div>

    <script>
        // Safe localStorage Wrapper
        const StorageManager = {
            get(key, fallback) {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : fallback;
                } catch (e) {
                    console.warn("Storage read error:", e);
                    return fallback;
                }
            },
            set(key, value) {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                } catch (e) {
                    console.warn("Storage write error:", e);
                }
            }
        };

        // Dati Iniziali di Default Generici
        const defaultFolders = [
            { id: 1, title: "Categoria 1" },
            { id: 2, title: "Categoria 2" },
            { id: 3, title: "Categoria 3" },
            { id: 4, title: "Categoria 4" }
        ];

        const defaultProducts = [
            { id: 101, folderId: 1, title: "Prodotto Standard A", price: 12.50 },
            { id: 102, folderId: 1, title: "Prodotto Standard B", price: 3.80 },
            { id: 201, folderId: 2, title: "Articolo Generico X", price: 22.00 },
            { id: 301, folderId: 3, title: "Dispositivo Tecnologico Y", price: 28.00 },
            { id: 401, folderId: 4, title: "Accessorio Varie Z", price: 15.00 }
        ];

        // Inizializzazione State
        let foldersData = StorageManager.get("smason_folders", defaultFolders);
        let productsData = StorageManager.get("smason_products", defaultProducts);
        let cartData = StorageManager.get("smason_cart", []);
        let currentActiveFolderId = null;

        document.addEventListener("DOMContentLoaded", () => {
            const gridContainer = document.getElementById("folders-grid");
            const productsGrid = document.getElementById("products-grid");
            const viewFolders = document.getElementById("view-folders");
            const viewProducts = document.getElementById("view-products");
            const categoryTitle = document.getElementById("category-title");
            const backToFoldersBtn = document.getElementById("back-to-folders");
            const homeLink = document.getElementById("home-link");

            // Ritorna alla Home Categorie
            function showHome() {
                currentActiveFolderId = null;
                viewProducts.classList.add("hidden");
                viewFolders.classList.remove("hidden");
                renderFolders();
            }

            homeLink.addEventListener("click", (e) => {
                e.preventDefault();
                showHome();
            });

            backToFoldersBtn.addEventListener("click", showHome);

            // Renderizza le cartelle/categorie
            function renderFolders() {
                gridContainer.innerHTML = "";
                const fragment = document.createDocumentFragment();
                
                foldersData.forEach(folder => {
                    const count = productsData.filter(p => Number(p.folderId) === Number(folder.id)).length;
                    const card = document.createElement("div");
                    card.className = "folder-card";
                    card.innerHTML = `
                        <h3>${folder.title}</h3>
                        <p>${count} prodotti disponibili</p>
                        <button class="btn" data-folder-id="${folder.id}">Esplora</button>
                    `;
                    fragment.appendChild(card);
                });
                gridContainer.appendChild(fragment);
            }

            // Renderizza i prodotti di una specifica cartella
            function renderProducts(folderId) {
                currentActiveFolderId = Number(folderId);
                const folder = foldersData.find(f => Number(f.id) === currentActiveFolderId);
                if (!folder) return;

                categoryTitle.textContent = folder.title;
                productsGrid.innerHTML = "";
                
                const filteredProducts = productsData.filter(p => Number(p.folderId) === currentActiveFolderId);
                
                if (filteredProducts.length === 0) {
                    productsGrid.innerHTML = "<p>Nessun prodotto presente in questa categoria.</p>";
                } else {
                    const fragment = document.createDocumentFragment();
                    filteredProducts.forEach(product => {
                        const card = document.createElement("div");
                        card.className = "product-card";
                        card.innerHTML = `
                            <h3>${product.title}</h3>
                            <div class="product-price">€ ${Number(product.price).toFixed(2)}</div>
                            <button class="btn" data-add-cart="${product.id}">Aggiungi al Carrello</button>
                        `;
                        fragment.appendChild(card);
                    });
                    productsGrid.appendChild(fragment);
                }

                viewFolders.classList.add("hidden");
                viewProducts.classList.remove("hidden");
            }

            // Event delegation sulla griglia categorie
            gridContainer.addEventListener("click", (e) => {
                const btn = e.target.closest("button[data-folder-id]");
                if (btn) {
                    renderProducts(btn.getAttribute("data-folder-id"));
                }
            });

            // Event delegation sulla griglia prodotti
            productsGrid.addEventListener("click", (e) => {
                const btn = e.target.closest("button[data-add-cart]");
                if (btn) {
                    addToCart(Number(btn.getAttribute("data-add-cart")));
                }
            });

            // Gestione Carrello Logica
            function addToCart(productId) {
                const product = productsData.find(p => p.id === productId);
                if (!product) return;

                const existingItem = cartData.find(item => item.id === productId);
                if (existingItem) {
                    existingItem.quantity += 1;
                } else {
                    cartData.push({ ...product, quantity: 1 });
                }
                StorageManager.set("smason_cart", cartData);
                updateCartCount();
                alert(`"${product.title}" aggiunto al carrello!`);
            }

            function updateCartCount() {
                const totalCount = cartData.reduce((sum, item) => sum + item.quantity, 0);
                document.getElementById("cart-count").textContent = totalCount;
            }

            function renderCartItems() {
                const container = document.getElementById("cart-items-container");
                const totalContainer = document.getElementById("cart-total-container");
                
                if (cartData.length === 0) {
                    container.innerHTML = "Il carrello è vuoto.";
                    totalContainer.textContent = "";
                    return;
                }

                container.innerHTML = "";
                let grandTotal = 0;

                cartData.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    grandTotal += itemTotal;

                    const row = document.createElement("div");
                    row.className = "cart-item-row";
                    row.innerHTML = `
                        <div>
                            <strong>${item.title}</strong><br>
                            <small>€ ${Number(item.price).toFixed(2)} x ${item.quantity}</small>
                        </div>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <button class="btn btn-outline" style="padding: 0.2rem 0.5rem;" data-cart-dec="${item.id}">-</button>
                            <span>${item.quantity}</span>
                            <button class="btn btn-outline" style="padding: 0.2rem 0.5rem;" data-cart-inc="${item.id}">+</button>
                            <button class="btn btn-danger" style="padding: 0.2rem 0.5rem;" data-cart-del="${item.id}">🗑</button>
                        </div>
                    `;
                    container.appendChild(row);
                });

                totalContainer.textContent = `Totale Complessivo: € ${grandTotal.toFixed(2)}`;
            }

            // Gestione eventi interazioni nel carrello
            document.getElementById("cart-items-container").addEventListener("click", (e) => {
                const incId = e.target.getAttribute("data-cart-inc");
                const decId = e.target.getAttribute("data-cart-dec");
                const delId = e.target.getAttribute("data-cart-del");

                if (incId) {
                    const item = cartData.find(i => i.id === Number(incId));
                    if (item) item.quantity++;
                } else if (decId) {
                    const item = cartData.find(i => i.id === Number(decId));
                    if (item) {
                        item.quantity--;
                        if (item.quantity <= 0) {
                            cartData = cartData.filter(i => i.id !== Number(decId));
                        }
                    }
                } else if (delId) {
                    cartData = cartData.filter(i => i.id !== Number(delId));
                }

                StorageManager.set("smason_cart", cartData);
                updateCartCount();
                renderCartItems();
            });

            // Gestione Modali (Carrello & Admin)
            const cartModal = document.getElementById("cart-modal");
            const openCartBtn = document.getElementById("open-cart-btn");
            const closeCartBtn = document.getElementById("close-cart-btn");
            const checkoutBtn = document.getElementById("checkout-btn");

            const adminModal = document.getElementById("admin-modal");
            const openAdminBtn = document.getElementById("open-admin-btn");
            const closeAdminBtn = document.getElementById("close-admin-btn");
            const addProductForm = document.getElementById("add-product-form");

            function toggleModal(modal, open) {
                if (open) {
                    modal.classList.add("active");
                    modal.setAttribute("aria-hidden", "false");
                    modal.querySelector(".modal").focus();
                    if (modal === cartModal) renderCartItems();
                    if (modal === adminModal) renderAdminProductsList();
                } else {
                    modal.classList.remove("active");
                    modal.setAttribute("aria-hidden", "true");
                }
            }

            openCartBtn.addEventListener("click", () => toggleModal(cartModal, true));
            closeCartBtn.addEventListener("click", () => toggleModal(cartModal, false));
            cartModal.addEventListener("click", (e) => { if (e.target === cartModal) toggleModal(cartModal, false); });

            openAdminBtn.addEventListener("click", () => toggleModal(adminModal, true));
            closeAdminBtn.addEventListener("click", () => toggleModal(adminModal, false));
            adminModal.addEventListener("click", (e) => { if (e.target === adminModal) toggleModal(adminModal, false); });

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    toggleModal(cartModal, false);
                    toggleModal(adminModal, false);
                }
            });

            // Checkout action
            checkoutBtn.addEventListener("click", () => {
                if (cartData.length === 0) {
                    alert("Il carrello è vuoto!");
                    return;
                }
                alert("Ordine inoltrato con successo! Grazie per aver scelto Smason Store.");
                cartData = [];
                StorageManager.set("smason_cart", cartData);
                updateCartCount();
                toggleModal(cartModal, false);
            });

            // Admin: Aggiunta Prodotto
            addProductForm.addEventListener("submit", (e) => {
                e.preventDefault();
                const name = document.getElementById("new-prod-name").value;
                const categoryId = Number(document.getElementById("new-prod-category").value);
                const price = parseFloat(document.getElementById("new-prod-price").value);

                const newProduct = {
                    id: Date.now(),
                    folderId: categoryId,
                    title: name,
                    price: price
                };

                productsData.push(newProduct);
                StorageManager.set("smason_products", productsData);
                
                addProductForm.reset();
                renderAdminProductsList();
                
                // Sincronizza la vista corrente se aperta sulla categoria modificata
                if (currentActiveFolderId) {
                    renderProducts(currentActiveFolderId);
                } else {
                    renderFolders();
                }
                alert("Prodotto aggiunto con successo!");
            });

            // Admin: Lista e Rimozione prodotti
            function renderAdminProductsList() {
                const listContainer = document.getElementById("admin-products-list");
                listContainer.innerHTML = "";

                if (productsData.length === 0) {
                    listContainer.innerHTML = "<p>Nessun prodotto in magazzino.</p>";
                    return;
                }

                productsData.forEach(prod => {
                    const row = document.createElement("div");
                    row.style.display = "flex";
                    row.style.justifyContent = "space-between";
                    row.style.alignItems = "center";
                    row.style.padding = "0.25rem 0";
                    row.style.borderBottom = "1px solid var(--border-color)";
                    row.innerHTML = `
                        <span>${prod.title} (€ ${Number(prod.price).toFixed(2)})</span>
                        <button class="btn btn-danger" style="padding: 0.15rem 0.4rem; font-size: 0.8rem;" data-admin-del="${prod.id}">Elimina</button>
                    `;
                    listContainer.appendChild(row);
                });
            }

            document.getElementById("admin-products-list").addEventListener("click", (e) => {
                const delId = e.target.getAttribute("data-admin-del");
                if (delId) {
                    productsData = productsData.filter(p => p.id !== Number(delId));
                    StorageManager.set("smason_products", productsData);
                    renderAdminProductsList();
                    
                    // Sincronizza la vista corrente o le categorie
                    if (currentActiveFolderId) {
                        renderProducts(currentActiveFolderId);
                    } else {
                        renderFolders();
                    }
                }
            });

            // Avvio iniziale
            renderFolders();
            updateCartCount();
        });
    </script>
</body>
</html>
